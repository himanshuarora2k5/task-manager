name: CI/CD Pipeline — Python Flask Deploy

on:
  push:
    branches: [ main ]

jobs:

  # ─── JOB 1: Test ──────────────────────────────────────────
  test:
    name: Install Dependencies and Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app.py && echo "Syntax check passed"

  # ─── JOB 2: Deploy (only if test passes) ──────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/task-manager
            git pull origin main
            pip3 install -r requirements.txt
            pm2 restart task-manager || pm2 start app.py --name task-manager --interpreter python3
            pm2 save
            echo "Deployed successfully at $(date)"